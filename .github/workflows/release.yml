# Target: tabnas/mcp -> .github/workflows/release.yml
#
# Publishes @tabnas/mcp to npm via GitHub OIDC Trusted Publishing (no
# token), writes the release tag, then publishes the MCP registry entry
# and deploys the Cloudflare Worker. See lsp__release.yml for the
# reasoning behind the dispatch/tagging shape.
#
# STAGED AS PART OF THE M9 SWEEP. This file previously lived at
# <repo>/ci/release.yml for promotion via apply-ci-folders.sh; it now
# sits with every other staged workflow, under apply-workflows.sh, so
# the next fleet-wide change reaches it. Its action pins move to the
# node24 majors (ADR-16) in all three jobs.
#
# THREE CHANNELS, ONE RELEASE, and that is the point of this file. A
# release publishes to npm, publishes the MCP registry entry, and
# deploys the Worker, so the three cannot drift apart the way they did
# on 2026-08-20. publish-registry and deploy-worker chain off
# publish-npm with `needs:` and carry no ref test, so they run on the
# dispatch path exactly as they do on a tag push — the invariant is
# preserved rather than quietly bypassed by the new trigger.
#
# NO GO MODULE in this repo, so there is no go/v tag and no `go` input:
# the dispatch creates ts/v<version> only. Adding a Go input here would
# offer a tag nothing serves.
#
# Secrets required, and neither is OIDC: MCP_REGISTRY_DNS_KEY for the
# registry (the dev.tabnas namespace is DNS-verified, so GitHub OIDC
# cannot authorise it), and CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# for the Worker. Only the npm publish is tokenless.
#
# Tests are not re-run here — admin/publish.sh verifies build+test
# locally against published deps, and ci.yml gates the bump PR.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> npm; cannot write refs
      contents: write   # GITHUB_TOKEN -> the ts/v tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0   # tags, for the already-released guard

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read the version
        id: v
        run: |
          V="$(node -p "require('./ts/package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

      - name: Refuse a dispatch from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must be dispatched from main (got ${{ github.ref }})"
          exit 1

      # NOT a hard refusal, and that is the difference from every other
      # repo in the fleet. Here the tag is not the end of the release:
      # publish-registry and deploy-worker come after it, and the whole
      # point of this file is that the three channels ship together. If
      # npm and the tag succeeded but the registry entry or the Worker
      # deploy failed, the documented recovery is to re-dispatch — and a
      # guard that failed closed on the existing tag would skip both
      # dependent jobs and make that recovery impossible.
      #
      # So an existing tag only suppresses the TAG step, exactly as an
      # already-published version only suppresses the publish step. Both
      # fail open; the run continues to the downstream jobs either way.
      - name: Decide whether the tag still needs creating
        id: tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/ts/v$V" >/dev/null; then
            echo "ts/v$V already exists — leaving it alone and continuing to the downstream jobs"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails OPEN: the REGISTRY, not the tag, decides whether a version
      # is released, so a run that published and then failed downstream
      # can be re-dispatched to finish the registry entry and the Worker
      # without dying on "cannot publish over the previously published
      # versions".
      - name: Publish to npm if the version is missing (OIDC)
        working-directory: ts
        run: |
          V="${{ steps.v.outputs.version }}"
          npm install -g npm@latest
          if npm view "@tabnas/mcp@$V" version >/dev/null 2>&1; then
            echo "@tabnas/mcp@$V is already on npm — skipping publish"
          else
            npm i
            npm run build --if-present
            npm publish --access public
          fi

      - name: Tag the release
        if: github.event_name == 'workflow_dispatch' && steps.tags.outputs.needed == 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "ts/v$V"
          git push origin "ts/v$V"

  publish-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Install mcp-publisher
        run: |
          VERSION=1.8.1
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version
      - name: Wait for npm to serve the new version
        run: |
          # The registry reads the npm package to verify mcpName. Publishing
          # before the registry can see the version fails with a confusing
          # "missing mcpName" rather than "not published yet".
          V=$(node -p "require('./ts/package.json').version")
          for i in $(seq 1 20); do
            [ "$(npm view @tabnas/mcp version 2>/dev/null)" = "$V" ] && exit 0
            sleep 15
          done
          echo "npm did not serve $V within 5 minutes" >&2
          exit 1
      - name: Publish to the MCP registry (DNS auth)
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_DNS_KEY" ]; then
            echo "MCP_REGISTRY_DNS_KEY is not set." >&2
            echo "  The dev.tabnas namespace is verified by the apex TXT" >&2
            echo "  record on tabnas.dev, so publishing needs that key." >&2
            exit 1
          fi
          mcp-publisher login dns --domain tabnas.dev --private-key "$MCP_REGISTRY_DNS_KEY"
          mcp-publisher publish

  # The hosted endpoint. Before this job, nothing redeployed it on release:
  # mcp.tabnas.dev served 0.1.7 for hours while npm said 0.1.9, and the only
  # thing that noticed was running parity.mjs by hand.
  #
  # Runs after publish-npm so a failed publish never reaches production, and
  # verifies rather than assumes: the deploy is only successful if the live
  # endpoint then reports the version this tag published AND answers
  # byte-identically to local core for every tool.
  deploy-worker:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
      - name: Build
        working-directory: ts
        # The Worker bundles src/data-bundle.ts and src/grammar-validator.js,
        # both generated and gitignored, so a deploy without a build ships
        # nothing at all.
        run: npm i && npm run build
      - name: Deploy
        working-directory: ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.json
      - name: Verify the endpoint serves this version, everywhere
        run: |
          # Requires the new version CONSECUTIVELY, not once. A Worker
          # rollout is not atomic across Cloudflare's edge: on 0.1.11 this
          # step saw the new version, passed, and the parity step
          # immediately after hit a colo still serving the old one. A gate
          # that flakes on a normal rollout is worse than no gate, because
          # it trains people to re-run rather than read it.
          V=$(node -p "require('./ts/package.json').version")
          STREAK=0
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS https://mcp.tabnas.dev/health | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
            if [ "$LIVE" = "$V" ]; then
              STREAK=$((STREAK + 1))
              [ "$STREAK" -ge 5 ] && { echo "settled on $V"; exit 0; }
            else
              [ "$STREAK" -gt 0 ] && echo "saw $LIVE after $STREAK match(es) — rollout still in progress"
              STREAK=0
            fi
            sleep 5
          done
          echo "endpoint did not settle on $V (last saw $LIVE)" >&2
          exit 1
      - name: Byte-parity, hosted vs local
        # The assertion the whole service rests on. A deploy that lands but
        # answers differently is worse than one that fails.
        run: node benchmark/parity.mjs

  # STILL not automated here: the skills/mcp.json pin, which needs write
  # access to ANOTHER repository. That is a different kind of credential from
  # a deploy token — it lets this workflow push commits elsewhere — so it
  # stays a maintainer step, and `node ts/tools/check-published.js` reports
  # it alongside every other surface.
