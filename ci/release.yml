# Staged per ADR-8: automation cannot push .github/workflows/*, so this file
# is written to <repo>/ci/release.yml for a maintainer to promote via
# admin/rollout/apply-ci-folders.sh.
#
# Publishes @tabnas/mcp to npm on a `ts/v*` tag push, via GitHub OIDC Trusted
# Publishing (no token). The build runs against the ALREADY-PUBLISHED
# dependency versions (npm i resolves them), so a failing build never
# publishes. Byte-identical to the release.yml in parser, json, jsonic and
# expr from `name:` onward.
#
# This repo has no go/, so there is no Go job. The Cloudflare worker is a
# separate delivery CHANNEL, but it is now part of the release: a tag push
# publishes to npm, publishes the MCP registry entry, and deploys the Worker,
# so the three cannot drift apart the way they did on 2026-08-20. The
# registry authenticates with GitHub OIDC; the Worker needs
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets.
#
# Tests are not re-run here — the orchestrator (admin/publish.sh) verifies
# build+test locally against published deps and requires a green main CI
# before tagging.
name: release

on:
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build and publish to npm (OIDC trusted publishing)
        working-directory: ts
        run: |
          npm install -g npm@latest
          npm i
          npm run build --if-present
          npm publish --access public

  # The npm publish above is the only thing a `ts/v*` tag updated. Everything
  # else that records this version was a separate manual step, and on
  # 2026-08-20 two of them silently fell behind: mcp.tabnas.dev served 0.1.7
  # while npm and the registry said 0.1.9, because two releases went out
  # without a redeploy.
  #
  # This job closes the one that can be closed without handing CI a new
  # credential: the MCP registry accepts GitHub OIDC, so no secret is
  # needed. It runs only after the npm publish succeeds, because the
  # registry verifies the npm package carries a matching `mcpName` — a
  # registry entry pointing at a version npm does not serve is worse than a
  # stale one.
  publish-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install mcp-publisher
        run: |
          VERSION=1.8.1
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version
      - name: Wait for npm to serve the new version
        run: |
          # The registry reads the npm package to verify mcpName. Publishing
          # before the registry can see the version fails with a confusing
          # "missing mcpName" rather than "not published yet".
          V=$(node -p "require('./ts/package.json').version")
          for i in $(seq 1 20); do
            [ "$(npm view @tabnas/mcp version 2>/dev/null)" = "$V" ] && exit 0
            sleep 15
          done
          echo "npm did not serve $V within 5 minutes" >&2
          exit 1
      - name: Publish to the MCP registry (GitHub OIDC)
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  # The hosted endpoint. Before this job, nothing redeployed it on release:
  # mcp.tabnas.dev served 0.1.7 for hours while npm said 0.1.9, and the only
  # thing that noticed was running parity.mjs by hand.
  #
  # Runs after publish-npm so a failed publish never reaches production, and
  # verifies rather than assumes: the deploy is only successful if the live
  # endpoint then reports the version this tag published AND answers
  # byte-identically to local core for every tool.
  deploy-worker:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build
        working-directory: ts
        # The Worker bundles src/data-bundle.ts and src/grammar-validator.js,
        # both generated and gitignored, so a deploy without a build ships
        # nothing at all.
        run: npm i && npm run build
      - name: Deploy
        working-directory: ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.json
      - name: Verify the endpoint serves this version
        run: |
          V=$(node -p "require('./ts/package.json').version")
          for i in $(seq 1 12); do
            LIVE=$(curl -fsS https://mcp.tabnas.dev/health | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
            [ "$LIVE" = "$V" ] && exit 0
            sleep 10
          done
          echo "endpoint still serving $LIVE, expected $V" >&2
          exit 1
      - name: Byte-parity, hosted vs local
        # The assertion the whole service rests on. A deploy that lands but
        # answers differently is worse than one that fails.
        run: node benchmark/parity.mjs

  # STILL not automated here: the skills/mcp.json pin, which needs write
  # access to ANOTHER repository. That is a different kind of credential from
  # a deploy token — it lets this workflow push commits elsewhere — so it
  # stays a maintainer step, and `node ts/tools/check-published.js` reports
  # it alongside every other surface.
