# The parts of Google's word list that are right for this project,
# carried as our own rule so they can sit at error level.
#
# Google.WordListCase itself is a WARNING here, and .vale.ini records
# what it reports on these pages. It maps `touch` to `tap`, a mobile-UI
# rule, `above` to `preceding`, and `admin` to `administrator`, where
# these pages name the fleet's admin repository.
#
# The swap carried here is its `file name` to `filename`, which collides
# with nothing on these pages.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/style/word-list'
level: error
ignorecase: true
action:
  name: replace
swap:
  file name: filename
  file names: filenames
